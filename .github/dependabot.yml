version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      ef-core:
        patterns: ["Microsoft.EntityFrameworkCore*", "Microsoft.AspNetCore.*"]
      test:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet.*"]
    ignore:
      # Each target framework pins its own EF Core and ASP.NET Core major (Directory.Packages.props); Dependabot does
      # not see the conditions and would move the net8.0 and net9.0 pins to the newest major.
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      # The published libraries depend on the lowest supported EF Core patch on purpose.
      - dependency-name: "Microsoft.EntityFrameworkCore.Relational"
        update-types: ["version-update:semver-patch"]
      # The analyzer builds against Roslyn 4.8 so it loads in every compiler since .NET 8's SDK and Visual Studio 17.8;
      # a newer Roslyn would raise that floor for every user. Raising it is a release decision, not a bump.
      - dependency-name: "Microsoft.CodeAnalysis*"
      # The corpus is compiled against these libraries, and the comparison scores these tools: a new major is a work
      # item (corpus cases, new results), not a bump. AutoMapper 15+ and MediatR 13+ are commercially licensed.
      - dependency-name: "AutoMapper"
        update-types: ["version-update:semver-major"]
      - dependency-name: "MediatR"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Mapster"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Mediator.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "FluentValidation"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Riok.Mapperly"
        update-types: ["version-update:semver-major"]
      - dependency-name: "LinqContraband"
        update-types: ["version-update:semver-major"]
      - dependency-name: "EFCore.QueryGuard"
        update-types: ["version-update:semver-major"]
      - dependency-name: "DbEye"
        update-types: ["version-update:semver-major"]
      - dependency-name: "MiniProfiler.*"
        update-types: ["version-update:semver-major"]
    # Dependabot regenerates packages.lock.json for one target framework only, so its NuGet pull requests fail the locked
    # restore in CI: apply the bump locally, run `dotnet restore --force-evaluate`, and commit the lock files with it.

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      docusaurus:
        patterns: ["@docusaurus/*", "react", "react-dom"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
